<script>
    // LINK CSV GOOGLE SHEETS
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRa50Mr58hg80Aj-iuGNIl2PkXgivx9cKcMN1iRgh-2ixbY7raFA1pDBtoUYa9oJs9w9lcHVaEy3yef/pub?gid=1227275087&single=true&output=csv";
    
    let allData = [];
    let picChartInstance = null;
    let tujuanChartInstance = null;

    // Helper untuk mencari value dari key (Abaikan Huruf Besar/Kecil & Spasi)
    function getRowValue(row, possibleKeys) {
        const keys = Object.keys(row);
        for (let pKey of possibleKeys) {
            const foundKey = keys.find(k => k.trim().toLowerCase() === pKey.toLowerCase());
            if (foundKey && row[foundKey]) {
                return row[foundKey].toString().trim();
            }
        }
        return "";
    }

    async function fetchMasterData() {
        const syncDot = document.getElementById('sync-dot');
        const syncText = document.getElementById('sync-text');
        syncDot.classList.add('syncing');
        syncText.innerText = "Memperbarui Data...";

        // Mengambil CSV langsung tanpa proxy untuk menghindari isu CORS Proxy terblokir
        const targetUrl = GOOGLE_SHEET_CSV_URL + '&t=' + new Date().getTime();

        try {
            const response = await fetch(targetUrl);
            if (!response.ok) throw new Error("Gagal mengambil respon data dari Google Sheets");
            
            const csvText = await response.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    console.log("Raw CSV Data:", results.data); // Cek konsol jika masih ada masalah

                    allData = results.data.map(row => {
                        const pic = getRowValue(row, ["Nama PIC", "PIC"]);
                        const status = getRowValue(row, ["Target", "Status Target", "Status"]);
                        const tujuan = getRowValue(row, ["Tujuan Pengiriman", "Tujuan"]);
                        
                        return {
                            tanggal: getRowValue(row, ["Tanggal"]) || "-",
                            pic: pic || "Tanpa PIC",
                            tujuan: tujuan || "Tanpa Tujuan",
                            mobil: getRowValue(row, ["Jenis Mobil", "Mobil"]) || "-",
                            box: getRowValue(row, ["Jumlah Box", "Box"]) || "0",
                            durasi: getRowValue(row, ["Durasi Loading", "Durasi"]) || "-",
                            status: status || "Pending",
                            ket: getRowValue(row, ["Keterangan"]) || "-",
                            imgMulai: getRowValue(row, ["Keterangan Gambar Mulai", "Gambar Mulai"]),
                            imgSelesai: getRowValue(row, ["Keterangan Gambar Selesai", "Gambar Selesai"])
                        };
                    })
                    // Filter hanya membuang baris yang benar-benar kosong total
                    .filter(item => item.tanggal !== "-" || item.pic !== "Tanpa PIC");

                    updateDropdowns();
                    applyFilters();

                    syncDot.classList.remove('syncing');
                    syncDot.style.backgroundColor = "#22c55e";
                    syncText.innerText = "Terhubung & Terupdate";
                    document.getElementById('last-update').innerText = `(${new Date().toLocaleTimeString()})`;
                }
            });
        } catch (error) {
            console.error("Gagal sinkronisasi data:", error);
            syncText.innerText = "Gagal Sinkronisasi";
            syncDot.classList.remove('syncing');
            syncDot.style.backgroundColor = "#ef4444";
        }
    }

    function updateDropdowns() {
        const currentPic = document.getElementById('filter-pic').value;
        const currentTujuan = document.getElementById('filter-tujuan').value;

        const picSet = new Set(allData.map(d => d.pic));
        const tujuanSet = new Set(allData.map(d => d.tujuan));

        const picSelect = document.getElementById('filter-pic');
        picSelect.innerHTML = '<option value="ALL">Semua PIC</option>';
        picSet.forEach(pic => {
            picSelect.innerHTML += `<option value="${pic}" ${pic === currentPic ? 'selected' : ''}>${pic}</option>`;
        });

        const tujuanSelect = document.getElementById('filter-tujuan');
        tujuanSelect.innerHTML = '<option value="ALL">Semua Tujuan</option>';
        tujuanSet.forEach(tj => {
            tujuanSelect.innerHTML += `<option value="${tj}" ${tj === currentTujuan ? 'selected' : ''}>${tj}</option>`;
        });
    }

    function applyFilters() {
        const selectedPic = document.getElementById('filter-pic').value;
        const selectedTujuan = document.getElementById('filter-tujuan').value;
        const selectedStatus = document.getElementById('filter-status').value;

        const filteredData = allData.filter(item => {
            const matchPic = selectedPic === 'ALL' || item.pic === selectedPic;
            const matchTujuan = selectedTujuan === 'ALL' || item.tujuan === selectedTujuan;
            const matchStatus = selectedStatus === 'ALL' || item.status.toLowerCase() === selectedStatus.toLowerCase();
            return matchPic && matchTujuan && matchStatus;
        });

        renderTable(filteredData);
        renderStats(filteredData);
        renderCharts(filteredData);
    }

    function renderTable(data) {
        const tbody = document.getElementById('data-table');
        tbody.innerHTML = '';

        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 20px;">Tidak ada data yang cocok / data kosong.</td></tr>`;
            return;
        }

        data.forEach(item => {
            const isAchieve = item.status.toLowerCase() === 'achieve';
            const badgeClass = isAchieve ? 'badge-achieve' : 'badge-not-achieve';
            
            const btnMulai = item.imgMulai && item.imgMulai.startsWith('http') 
                ? `<a href="${item.imgMulai}" target="_blank" class="btn-img">🖼️ Lihat Gambar</a>` 
                : `<span class="no-img">-</span>`;

            const btnSelesai = item.imgSelesai && item.imgSelesai.startsWith('http') 
                ? `<a href="${item.imgSelesai}" target="_blank" class="btn-img">🖼️ Lihat Gambar</a>` 
                : `<span class="no-img">-</span>`;

            const row = `
                <tr>
                    <td>${item.tanggal}</td>
                    <td><strong>${item.pic}</strong></td>
                    <td>${item.tujuan}</td>
                    <td>${item.mobil}</td>
                    <td>${item.box}</td>
                    <td>${item.durasi}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>${item.ket}</td>
                    <td>${btnMulai}</td>
                    <td>${btnSelesai}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function renderStats(data) {
        const total = data.length;
        const achieve = data.filter(d => d.status.toLowerCase() === 'achieve').length;
        const notAchieve = data.filter(d => d.status.toLowerCase() === 'not achieve').length;
        const rate = total > 0 ? ((achieve / total) * 100).toFixed(1) : 0;

        document.getElementById('total-shipment').innerText = total;
        document.getElementById('total-achieve').innerText = achieve;
        document.getElementById('total-not-achieve').innerText = notAchieve;
        document.getElementById('rate-achieve').innerText = `${rate}%`;
    }

    function renderCharts(data) {
        const picMap = {};
        data.forEach(d => {
            if (!picMap[d.pic]) picMap[d.pic] = { achieve: 0, notAchieve: 0 };
            if (d.status.toLowerCase() === 'achieve') picMap[d.pic].achieve++;
            else if (d.status.toLowerCase() === 'not achieve') picMap[d.pic].notAchieve++;
        });

        const picLabels = Object.keys(picMap);
        const achieveData = picLabels.map(p => picMap[p].achieve);
        const notAchieveData = picLabels.map(p => picMap[p].notAchieve);

        if (picChartInstance) picChartInstance.destroy();
        const ctx1 = document.getElementById('picChart').getContext('2d');
        picChartInstance = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: picLabels,
                datasets: [
                    { label: 'Achieve', data: achieveData, backgroundColor: '#22c55e' },
                    { label: 'Not Achieve', data: notAchieveData, backgroundColor: '#ef4444' }
                ]
            },
            options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } } }
        });

        const tujuanMap = {};
        data.forEach(d => {
            tujuanMap[d.tujuan] = (tujuanMap[d.tujuan] || 0) + 1;
        });

        if (tujuanChartInstance) tujuanChartInstance.destroy();
        const ctx2 = document.getElementById('tujuanChart').getContext('2d');
        tujuanChartInstance = new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: Object.keys(tujuanMap),
                datasets: [{
                    data: Object.values(tujuanMap),
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1', '#14b8a6', '#f97316']
                }]
            },
            options: { responsive: true }
        });
    }

    // Inisialisasi Pertama
    fetchMasterData();

    // Auto Refresh Setiap 15 Detik
    setInterval(fetchMasterData, 15000); 
</script>
