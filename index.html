<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinkronisasi Data Real-Time Antar Perangkat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .display-box {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #2980b9;
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .info {
            font-size: 12px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 15px;
        }
        .status {
            font-size: 11px;
            color: #27ae60;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>

    <!-- Memuat Firebase SDK versi modular/compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>Pusat Pembaruan Data</h2>
        <div class="status" id="connectionStatus">Menghubungkan ke Cloud...</div>
        
        <div class="display-box" id="dataDisplay">
            Memuat data...
        </div>

        <div class="input-group">
            <input type="text" id="dataInput" placeholder="Ketik pembaruan di sini...">
            <button onclick="simpanData()">Simpan</button>
        </div>

        <div class="info">
            Perubahan dari HP, Laptop, atau Komputer akan otomatis sinkron secara real-time!
        </div>
    </div>

    <script>
        // Konfigurasi Firebase Anda (Gratis & Aman untuk uji coba sinkronisasi)
        const firebaseConfig = {
            databaseURL: "https://dashboard-loading-shipment-default-rtdb.firebaseio.com/" 
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('updateTerbaru');

        // Indikator koneksi
        document.getElementById('connectionStatus').innerText = "Terhubung ke Cloud (Real-time Aktif)";

        // Mendengarkan perubahan data secara real-time dari database cloud
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data !== null) {
                document.getElementById('dataDisplay').innerText = data;
            } else {
                document.getElementById('dataDisplay').innerText = "Belum ada data.";
            }
        });

        // Fungsi untuk menyimpan data baru ke cloud
        function simpanData() {
            const nilaiInput = document.getElementById('dataInput').value;
            if (nilaiInput.trim() === "") {
                alert("Mohon masukkan teks pembaruan!");
                return;
            }

            // Kirim data ke Firebase Database
            dbRef.set(nilaiInput)
                .then(() => {
                    document.getElementById('dataInput').value = "";
                    // Tidak perlu alert mengganggu, karena layar akan otomatis berubah di semua perangkat
                })
                .catch((error) => {
                    alert("Gagal menyimpan: " + error.message);
                });
        }
    </script>

</body>
</html>
