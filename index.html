<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Cari tabel berdasarkan letak / struktur tabel Anda
        const table = document.querySelector('table');
        if (!table) return;

        const tbody = table.querySelector('tbody') || table;
        const rows = Array.from(tbody.querySelectorAll('tr'));

        // Filter baris yang memiliki data (mengabaikan header jika ada di tbody)
        const dataRows = rows.filter(row => row.querySelectorAll('td').length > 0);

        // Helper untuk parsing tanggal format DD/MM/YYYY
        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const cleanStr = dateStr.trim();
            const parts = cleanStr.split('/');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                return new Date(year, month, day);
            }
            return new Date(cleanStr);
        }

        // Urutkan dari tanggal terkecil ke terbesar (kolom ke-2 / Index 1)
        dataRows.sort((a, b) => {
            const cellA = a.querySelectorAll('td')[1]?.textContent || '';
            const cellB = b.querySelectorAll('td')[1]?.textContent || '';
            return parseDate(cellA) - parseDate(cellB);
        });

        // Masukkan kembali baris yang sudah urut tanpa merubah styling HTML/CSS bawaan
        dataRows.forEach(row => tbody.appendChild(row));
    });
</script>
