<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinkronisasi Pembaruan Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .display-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #2980b9;
            word-break: break-word;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .info {
            font-size: 12px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pusat Pembaruan Data</h2>
        
        <div class="display-box" id="dataDisplay">
            Belum ada data terbaru.
        </div>

        <div class="input-group">
            <input type="text" id="dataInput" placeholder="Ketik pembaruan di sini...">
            <button onclick="simpanData()">Simpan</button>
        </div>

        <div class="info">
            Perubahan akan otomatis tersinkronisasi di perangkat yang terhubung.
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil dan menampilkan data
        function muatData() {
            const dataTersimpan = localStorage.getItem('updateTerbaru');
            if (dataTersimpan) {
                document.getElementById('dataDisplay').innerText = dataTersimpan;
            }
        }

        // Fungsi untuk menyimpan data baru
        function simpanData() {
            const nilaiInput = document.getElementById('dataInput').value;
            if (nilaiInput.trim() === "") {
                alert("Mohon masukkan teks pembaruan!");
                return;
            }

            // Simpan ke localStorage
            localStorage.setItem('updateTerbaru', nilaiInput);
            document.getElementById('dataInput').value = "";
            muatData();
            alert("Data berhasil diperbarui!");
        }

        // Mendengarkan perubahan data secara real-time antar tab/jendela
        window.addEventListener('storage', function(event) {
            if (event.key === 'updateTerbaru') {
                muatData();
            }
        });

        // Muat data saat halaman pertama kali dibuka
        window.onload = muatData;
    </script>

</body>
</html>
